name: Election Update Monitor

on:
  schedule:
    # Runs daily at 8am ET (1pm UTC)
    - cron: '0 13 * * *'
  workflow_dispatch:
    # Manual trigger — click "Run workflow" in GitHub Actions tab
    inputs:
      scan_start:
        description: "Catch-up only: first date to cover (YYYY-MM-DD). Leave blank for a normal scan."
        required: false
        default: ""
      scan_end:
        description: "Catch-up only: last date to cover (YYYY-MM-DD)."
        required: false
        default: ""

permissions:
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run election monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SCAN_START: ${{ inputs.scan_start }}
          SCAN_END: ${{ inputs.scan_end }}
        run: python scripts/monitor.py
