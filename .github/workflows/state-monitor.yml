name: State Bill Monitor

on:
  schedule:
    # 5:37 AM ET in winter, 6:37 AM ET in summer (10:37 UTC), off the busy top of the hour; GitHub may still start it late
    - cron: "37 10 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run state bill monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python state_monitor.py

      - name: Commit run results
        run: |
          git config user.email "bot@electionriskmap.org"
          git config user.name "ERM State Monitor Bot"
          git add data/bills.json
          MSG=$(python -c 'import json; d = json.load(open("data/bills.json")); s = d["last_run_summary"]; print("chore: state monitor run %s (%d verified, %d unchecked)" % (d["last_run"], s["verified"], s["unchecked"]))')
          git diff --staged --quiet || git commit -m "$MSG"
          git push
